name: ci

# `make check` on every push/PR: the struct-only guard, the D unittests
# (pathutil + json), and the full Python LSP suite. The nightly workflow builds
# and publishes binaries; this one is the correctness gate.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The vendored frontend is 2.113.0-beta.1. A newer compiler's druntime
      # (2.113.0 release or rc) does not analyse cleanly under it, while
      # 2.112.1's does and is still new enough to build the frontend. The
      # action sets `$DC` (build) and `$DMD` (stdlib for the tests) to it.
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-2.112.1

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          dmd --version
          make check
