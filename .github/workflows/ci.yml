name: ci

# `make check` on every push/PR: the struct-only guard, the D unittests
# (pathutil + json), and the full Python LSP suite. The nightly workflow builds
# and publishes binaries; this one is the correctness gate.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # LDC 1.42 is based on DMD 2.112.1, whose druntime the vendored
      # 2.113.0-beta.1 frontend analyses cleanly (the 2.113.0 release's does
      # not). Use its dmd-compatible driver, as the nightly build does; `$DMD`
      # (stdlib for the tests) points at it.
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.42.0

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          ldmd2 --version
          make check DC=ldmd2
